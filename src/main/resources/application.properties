# OpenApi configuration
mp.openapi.extensions.smallrye.info.title=EOSC Data Transfer API
mp.openapi.extensions.smallrye.info.description=The EOSC Data Transfer API moves files between data \
repositories, transfer engines and storage systems. It parses DOIs/PIDs into file lists, estimates the cost \
of a transfer in credits, starts and tracks transfers, and lists or manipulates storage elements.\n\
\n\
**API groups**\n\
\n\
- **DOI Parsing** - `GET /parser` returns the files behind a DOI or PID.\n\
- **Data Transfer** - estimate, start, search, inspect and cancel transfers.\n\
- **Data Transfer User** - identity of the authenticated caller.\n\
- **Data Storage** - list destination types and manage files and folders in a storage system.\n\
- **Service Info** - version of the running service.\n\
\n\
**Authorization**\n\
\n\
Operations that need authorization take an EGI Check-in OIDC access token in the `Authorization` header. \
The token is forwarded as received to the parser, the transfer engine and the storage system; this service \
does not interpret it. Storage systems that need their own credentials (an access key and secret key, or a \
user name and password) take them Base-64 encoded in the `Authorization-Storage` header. HTTP status `419` \
means the credentials must be re-delegated before the call can succeed.\n\
\n\
**Destinations**\n\
\n\
Operations on transfers and storage elements take a `dest` query parameter that selects the destination \
storage type. It defaults to `dcache`; `GET /storage/destinations` lists the values configured on this \
instance.\n\
\n\
**Responses**\n\
\n\
Successful operations return the documented schema. Failures always return the `Error` envelope, where the \
HTTP status carries the outcome and `id` is a stable lowerCamelCase key such as `destInvalid` or `noFiles`.
